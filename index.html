<!doctype html>
<html lang="ru" class="lock">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oxygen — кварталы</title>
<meta name="description" content="Oxygen — прототип мира из кварталов: два маршрута, у каждого квартала свой фон, свет и материал. Кейсы пока заменены кубами.">
<link rel="icon" href="assets/iskra.svg">
<style>
@font-face{font-family:"TT";src:url("assets/fonts/tiktok-sans.woff2") format("woff2");font-weight:300 900;font-display:swap}
@font-face{font-family:"AP";src:url("assets/fonts/anonymous-pro.woff2") format("woff2");font-display:swap}
:root{--bg:#111111;--cream:#E1D9CF;--red:#F40709;--mute:#8d867e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;color:var(--cream)}
body{font:400 17px/1.45 "TT",system-ui,sans-serif}
html.lock,html.lock body{overflow:hidden}
#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#track{height:100vh}
.t{font:400 12px/1.4 "AP",monospace;letter-spacing:.04em;text-transform:lowercase}
.hud{position:fixed;z-index:3;pointer-events:none}
#logo{left:28px;top:24px;width:118px}
#zone{left:28px;bottom:26px}
#zone b{display:block;font:520 clamp(34px,4.4vw,64px)/.95 "TT",sans-serif;letter-spacing:-.01em;margin-top:6px;text-transform:lowercase}
#zone .t{color:var(--red)}
#pct{right:28px;bottom:26px;color:var(--red)}
#route{right:28px;top:28px;pointer-events:auto;background:none;border:0;color:var(--cream);cursor:pointer;text-decoration:underline;display:none}
#hint{left:50%;bottom:26px;translate:-50% 0;opacity:.6;transition:opacity .6s}
/* развилка: два проспекта на весь экран */
#fork{position:fixed;inset:0;z-index:4;display:grid;grid-template-columns:1fr 1fr;opacity:0;pointer-events:none;transition:opacity .5s}
#fork.on{opacity:1;pointer-events:auto}
#fork button{all:unset;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;padding:0 28px 12vh;background:linear-gradient(to top,rgba(0,0,0,.75),rgba(0,0,0,0) 60%);transition:background .25s}
#fork button:hover{background:linear-gradient(to top,rgba(244,7,9,.75),rgba(244,7,9,0) 70%)}
#fork button+button{border-left:1px solid rgba(225,217,207,.16)}
#fork b{font:520 clamp(48px,6vw,104px)/.9 "TT",sans-serif;margin:8px 0 10px;text-transform:lowercase}
#fork p{max-width:32ch;opacity:.8}
/* прелоадер — изначальная искра: летит в темноте, пока грузится мир, потом встаёт на место 3D-искры */
#loader{position:fixed;inset:0;z-index:10;background:#000;transition:opacity .9s ease-out;overflow:hidden}
#loader .spark{position:absolute;left:50%;top:50%;width:54px;translate:-50% -50%;animation:drift 7s ease-in-out infinite}
#loader .spark img{display:block;width:100%;animation:spin 5s linear infinite;filter:drop-shadow(0 0 6px #f40709) drop-shadow(0 0 26px rgba(244,7,9,.7))}
#loader .spark::before{content:"";position:absolute;inset:-260%;border-radius:50%;background:radial-gradient(closest-side,rgba(244,7,9,.22),rgba(244,7,9,.05) 55%,transparent);animation:breath 2.4s ease-in-out infinite}
#loader .pct{position:absolute;left:50%;bottom:9vh;translate:-50% 0;opacity:.55}
#loader.ready .spark{animation:none;transition:left 1.1s cubic-bezier(.6,0,.2,1),top 1.1s cubic-bezier(.6,0,.2,1),width 1.1s cubic-bezier(.6,0,.2,1);left:var(--tx,50%);top:var(--ty,50%);width:var(--tw,120px)}
#loader.ready .spark img{animation:none}
#loader.ready .pct{opacity:0;transition:opacity .4s}
#loader.done{opacity:0;pointer-events:none}
@keyframes drift{0%{left:18%;top:70%}22%{left:38%;top:34%}45%{left:71%;top:58%}68%{left:58%;top:24%}86%{left:30%;top:46%}100%{left:18%;top:70%}}
@keyframes breath{50%{opacity:.55;scale:.8}}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:760px){#logo,#zone{left:16px}#pct,#route{right:16px}#fork{grid-template-columns:1fr;grid-template-rows:1fr 1fr}#fork button+button{border-left:0;border-top:1px solid rgba(225,217,207,.16)}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="loader"><div class="spark"><img src="assets/iskra.svg" alt=""></div><span class="t pct" id="loadPct">00%</span></div>
<canvas id="gl"></canvas>
<div id="track"></div>
<img class="hud" id="logo" src="assets/logo.svg" alt="oxygen">
<div class="hud" id="zone"><span class="t" id="zoneN"></span><b id="zoneT"></b></div>
<div class="hud t" id="pct">000%</div>
<div class="hud t" id="hint">скролл — идти за искрой</div>
<button class="hud t" id="route"></button>
<div id="fork">
  <button data-r="A"><span class="t">маршрут а · прямо</span><b>азия → спорт</b><p class="t">узкий чёрный переулок и чаша стадиона</p></button>
  <button data-r="B"><span class="t">маршрут б · направо</span><b>ритейл → ai → мерч</b><p class="t">склад, пустота и светлая галерея</p></button>
</div>
<script type="module" src="world.js"></script>
</body>
</html>
