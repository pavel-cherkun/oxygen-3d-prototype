<!doctype html>
<html lang="ru" class="lock">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oxygen — кварталы</title>
<meta name="description" content="Oxygen — прототип мира из кварталов: два маршрута, у каждого квартала свой фон, свет и материал. Кейсы пока заменены кубами.">
<link rel="icon" href="assets/iskra.svg">
<style>
@font-face{font-family:"TT";src:url("assets/fonts/tiktok-sans.woff2") format("woff2");font-weight:300 900;font-display:swap}
@font-face{font-family:"AP";src:url("assets/fonts/anonymous-pro.woff2") format("woff2");font-display:swap}
:root{--bg:#111111;--cream:#E1D9CF;--red:#F40709;--mute:#8d867e}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;color:var(--cream)}
body{font:400 17px/1.45 "TT",system-ui,sans-serif}
html.lock,html.lock body{overflow:hidden}
#gl{position:fixed;inset:0;width:100vw;height:100vh;display:block}
#track{height:100vh}
.t{font:400 12px/1.4 "AP",monospace;letter-spacing:.04em;text-transform:lowercase}
.hud{position:fixed;z-index:3;pointer-events:none}
#logo{left:28px;top:24px;width:118px}
#zone{left:28px;bottom:26px}
#zone b{display:block;font:520 clamp(34px,4.4vw,64px)/.95 "TT",sans-serif;letter-spacing:-.01em;margin-top:6px;text-transform:lowercase}
#zone .t{color:var(--red)}
#pct{right:28px;bottom:26px;color:var(--red)}
#route{right:28px;top:28px;pointer-events:auto;background:none;border:0;color:var(--cream);cursor:pointer;text-decoration:underline;display:none}
#hint{left:50%;bottom:26px;translate:-50% 0;opacity:.6;transition:opacity .6s}
#end{position:fixed;left:50%;bottom:9vh;translate:-50% 0;z-index:3;text-align:center;opacity:0;pointer-events:none;transition:opacity .8s}
#end.on{opacity:1;pointer-events:auto}
#end h2{font:520 clamp(36px,5vw,72px)/1 "TT",sans-serif;margin:8px 0 18px;text-transform:lowercase}
#end button{all:unset;cursor:pointer;border:1px solid var(--red);border-radius:40px;padding:12px 24px;color:var(--cream)}
#end button:hover{background:var(--red)}
/* развилка: два проспекта на весь экран */
#fork{position:fixed;inset:0;z-index:4;display:grid;grid-template-columns:1fr 1fr;opacity:0;pointer-events:none;transition:opacity .5s}
#fork.on{opacity:1;pointer-events:auto}
#fork button{all:unset;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;padding:0 28px 12vh;background:linear-gradient(to top,rgba(0,0,0,.75),rgba(0,0,0,0) 60%);transition:background .25s}
#fork button:hover{background:linear-gradient(to top,rgba(244,7,9,.75),rgba(244,7,9,0) 70%)}
#fork button+button{border-left:1px solid rgba(225,217,207,.16)}
#fork b{font:520 clamp(48px,6vw,104px)/.9 "TT",sans-serif;margin:8px 0 10px;text-transform:lowercase}
#fork p{max-width:32ch;opacity:.8}
/* прелоадер — изначальная искра: летит в темноте, пока грузится мир, потом встаёт на место 3D-искры */
#loader{position:fixed;inset:0;z-index:10;background:#000;transition:opacity .9s ease-out;overflow:hidden}
#loader .spark{position:absolute;left:50%;top:50%;width:54px;translate:-50% -50%;animation:drift 7s ease-in-out infinite}
#loader .spark img{display:block;width:100%;animation:spin 5s linear infinite;filter:drop-shadow(0 0 6px #f40709) drop-shadow(0 0 26px rgba(244,7,9,.7))}
#loader .spark::before{content:"";position:absolute;inset:-260%;border-radius:50%;background:radial-gradient(closest-side,rgba(244,7,9,.22),rgba(244,7,9,.05) 55%,transparent);animation:breath 2.4s ease-in-out infinite}
#loader .pct{position:absolute;left:50%;bottom:9vh;translate:-50% 0;opacity:.55}
#loader.ready .spark{animation:none;transition:left 1.1s cubic-bezier(.6,0,.2,1),top 1.1s cubic-bezier(.6,0,.2,1),width 1.1s cubic-bezier(.6,0,.2,1);left:var(--tx,50%);top:var(--ty,50%);width:var(--tw,120px)}
#loader.ready .spark img{animation:none}
#loader.ready .pct{opacity:0;transition:opacity .4s}
#loader.done{opacity:0;pointer-events:none}
@keyframes drift{0%{left:18%;top:70%}22%{left:38%;top:34%}45%{left:71%;top:58%}68%{left:58%;top:24%}86%{left:30%;top:46%}100%{left:18%;top:70%}}
@keyframes breath{50%{opacity:.55;scale:.8}}
@keyframes spin{to{transform:rotate(360deg)}}
/* карточка кейса у остановки: в половине кадра напротив превью */
#card{position:fixed;z-index:3;right:6vw;top:50%;translate:0 -50%;width:min(420px,38vw);opacity:0;pointer-events:none;transition:opacity .45s,transform .45s;transform:translateY(12px)}
#card.left{right:auto;left:6vw}
#card::before{content:"";position:absolute;inset:-60px -70px;z-index:-1;background:radial-gradient(closest-side,rgba(0,0,0,.62),rgba(0,0,0,.35) 60%,transparent);pointer-events:none}
#card.on{opacity:1;pointer-events:auto;transform:none}
#card .t{color:var(--red)}
#card h3{font:520 clamp(32px,3.4vw,54px)/.95 "TT",sans-serif;margin:10px 0 14px;text-transform:lowercase;text-wrap:balance}
#card p{font-size:18px;line-height:1.35;opacity:.86;max-width:36ch;text-wrap:pretty}
#card button{all:unset;cursor:pointer;margin-top:20px;display:inline-block;border:1px solid var(--red);border-radius:40px;padding:12px 22px;color:var(--cream)}
#card button:hover{background:var(--red)}
/* страница кейса поверх мира */
#modal{position:fixed;inset:0;z-index:20;background:#0d0d0d;overflow:auto;overscroll-behavior:contain;display:none}
#modal.on{display:block}
#modal .wrap{max-width:1180px;margin:0 auto;padding:96px 40px 96px}
#modal .t{color:var(--red)}
#modal .ch{padding-bottom:28px;border-bottom:1px solid #262626}
#modal h1{font-weight:520;font-size:clamp(52px,8vw,128px);line-height:.9;margin:14px 0 18px;text-transform:lowercase;letter-spacing:-.02em;text-wrap:balance;max-width:14ch}
#modal .tags{display:flex;flex-wrap:wrap;gap:8px}
#modal .tags span{font:400 13px/1 "AP",monospace;border:1px solid #3a3a3a;border-radius:30px;padding:7px 12px;color:var(--cream)}
#modal .pass{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px 32px;margin:0;padding:26px 0;border-bottom:1px solid #262626}
#modal .pass dd{margin:6px 0 0;font-size:18px;line-height:1.3}
#modal .ti{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin:44px 0 52px}
#modal .ti p{font-size:clamp(22px,2.2vw,30px);line-height:1.2;margin-top:12px;text-wrap:pretty}
#modal section{margin:0 0 56px}
#modal .gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin:0 0 56px}
#modal .gal figure img{width:100%;display:block;aspect-ratio:16/10;object-fit:cover;background:#1a1a1a}
#modal figcaption{margin-top:8px;font-size:15px}
#modal .steps{list-style:none;margin:16px 0 0;padding:0;border-top:1px solid #262626}
#modal .steps li{display:grid;grid-template-columns:110px minmax(180px,1fr) 2fr;gap:24px;align-items:baseline;padding:20px 0;border-bottom:1px solid #262626}
#modal .steps .n{font-size:13px}
#modal .steps b{font-weight:520;font-size:22px;line-height:1.15;text-transform:lowercase}
#modal .steps p{font-size:18px;line-height:1.4;opacity:.82;text-wrap:pretty}
#modal .res{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:32px 28px;margin-top:20px}
#modal .res b{display:block;font-weight:520;font-size:clamp(56px,6.4vw,96px);line-height:.9;letter-spacing:-.02em;color:var(--red);margin-bottom:12px;white-space:nowrap}
#modal .res span{display:block;font-size:17px;line-height:1.35;max-width:26ch;opacity:.86}
#modal .q{margin:0 0 56px;padding:36px 0 0;border-top:1px solid var(--red);max-width:900px}
#modal .q p{font-size:clamp(24px,2.6vw,36px);line-height:1.2;text-wrap:pretty}
#modal .q cite{display:block;margin-top:18px;font-style:normal}
#modal .note{margin:-24px 0 48px;opacity:.7}
#modal .cta{padding-top:36px;border-top:1px solid #262626}
#modal .cta p{font-size:26px;margin-bottom:4px}
#modal .btn{display:inline-flex;align-items:center;gap:10px;margin:16px 8px 0 0;background:var(--red);color:#111;border:0;font:520 16px "TT",sans-serif;padding:12px 18px;border-radius:40px;cursor:pointer}
#modal .btn.ghost{background:transparent;color:var(--cream);border:1px solid #444}
#modal .close{all:unset;position:fixed;top:22px;right:28px;z-index:21;cursor:pointer;color:var(--cream);border:1px solid #444;border-radius:40px;padding:8px 16px;background:#0d0d0d}
@media(max-width:760px){#modal .steps li{grid-template-columns:1fr;gap:6px}#modal .ti{grid-template-columns:1fr;gap:28px}#modal .wrap{padding:80px 16px}}
@media(max-width:760px){#card{left:16px;right:16px;top:auto;bottom:18vh;translate:none;width:auto}#card.left{left:16px}#modal .ti{grid-template-columns:1fr}#modal .wrap{padding:80px 16px}}
@media(max-width:760px){#logo,#zone{left:16px}#pct,#route{right:16px}#fork{grid-template-columns:1fr;grid-template-rows:1fr 1fr}#fork button+button{border-left:0;border-top:1px solid rgba(225,217,207,.16)}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="loader"><div class="spark"><img src="assets/iskra.svg" alt=""></div><span class="t pct" id="loadPct">00%</span></div>
<canvas id="gl"></canvas>
<div id="track"></div>
<img class="hud" id="logo" src="assets/logo.svg" alt="oxygen">
<div class="hud" id="zone"><span class="t" id="zoneN"></span><b id="zoneT"></b></div>
<div class="hud t" id="pct">000%</div>
<div class="hud t" id="hint">скролл — идти за искрой</div>
<button class="hud t" id="route"></button>
<div id="end"><span class="t">{06} финал</span><h2>добавьте кислорода</h2><button class="t">есть задача →</button></div>
<div id="card"></div>
<div id="modal"><button class="close t">закрыть ✕</button><div class="wrap" id="modalBody"></div></div>
<div id="fork">
  <button data-r="btl"><span class="t">btl · на земле · в арку</span><b>btl</b><p class="t">гости приходят зрителями и становятся участниками: зоны, фестивали, гонки, промо</p></button>
  <button data-r="atl"><span class="t">atl · над городом · вверх, за светом</span><b>atl</b><p class="t">кампании, которые продолжаются без нас: вселенные, бренд-платформы, ai-продакшн</p></button>
</div>
<script type="module" src="world.js"></script>
</body>
</html>
